[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maildeno"
version = "2.0.4"
description = "Official Python SDK for the Maildeno render API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["maildeno", "email", "template", "render", "sdk"]
authors = [{ name = "Maildeno" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1.0",
    "wasmtime>=45.0.0",
    "typing-extensions>=4.15.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "mypy>=2.1.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://maildeno.com"
Documentation = "https://docs.maildeno.com"
Repository = "https://github.com/maildeno/sdk-python"
Issues = "https://github.com/maildeno/sdk-python/issues"
Changelog = "https://github.com/maildeno/sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["maildeno"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = ["/maildeno", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["maildeno"]
omit = ["maildeno/_types.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["maildeno"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
pythonVersion = "3.9"